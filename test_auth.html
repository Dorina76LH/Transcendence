<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transcendence — API Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a0a2e;
      color: #e0d0ff;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 2rem;
      color: #b06aff;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    .subtitle {
      color: #7a5a99;
      margin-bottom: 40px;
      font-size: 0.9rem;
    }

    .cards {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 1000px;
    }

    .card {
      background: #2a1245;
      border: 1px solid #5a2a8a;
      border-radius: 16px;
      padding: 28px;
      width: 300px;
      box-shadow: 0 0 20px rgba(180, 100, 255, 0.15);
    }

    .card h2 {
      font-size: 1.2rem;
      color: #c080ff;
      margin-bottom: 20px;
      border-bottom: 1px solid #5a2a8a;
      padding-bottom: 10px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: #9a7acc;
      margin-bottom: 4px;
      margin-top: 12px;
    }

    input {
      width: 100%;
      padding: 10px 14px;
      background: #1a0a2e;
      border: 1px solid #5a2a8a;
      border-radius: 8px;
      color: #e0d0ff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #b06aff;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: #7a2aff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #9a4aff; }

    button.danger {
      background: #8a1a3a;
    }
    button.danger:hover { background: #aa2a4a; }

    .result {
      margin-top: 16px;
      padding: 12px;
      background: #1a0a2e;
      border-radius: 8px;
      font-size: 0.8rem;
      min-height: 60px;
      word-break: break-all;
      border: 1px solid #3a1a5a;
      white-space: pre-wrap;
    }

    .result.success { border-color: #2a8a4a; color: #6aff9a; }
    .result.error   { border-color: #8a2a2a; color: #ff6a6a; }

    .token-display {
      background: #2a1245;
      border: 1px solid #5a2a8a;
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 1000px;
      margin-top: 24px;
    }

    .token-display h2 {
      color: #c080ff;
      margin-bottom: 16px;
      font-size: 1.1rem;
    }

    .token-box {
      background: #1a0a2e;
      border: 1px solid #3a1a5a;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.75rem;
      word-break: break-all;
      color: #9a7acc;
      min-height: 40px;
    }

    .status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      margin-left: 10px;
    }
    .status.connected    { background: #1a4a2a; color: #6aff9a; }
    .status.disconnected { background: #4a1a1a; color: #ff6a6a; }
  </style>
</head>
<body>

  <h1>TRANSCENDENCE</h1>
  <p class="subtitle">API Test Page — Django REST + JWT</p>

  <div class="cards">

    <!-- REGISTER -->
    <div class="card">
      <h2>📝 Register</h2>
      <label>Username</label>
      <input type="text" id="reg-username" placeholder="Enter username">
      <label>Email</label>
      <input type="email" id="reg-email" placeholder="Enter email">
      <label>Password</label>
      <input type="password" id="reg-password" placeholder="Enter password">
      <button onclick="register()">Register</button>
      <div class="result" id="reg-result">Waiting...</div>
    </div>

    <!-- LOGIN -->
    <div class="card">
      <h2>🔐 Login</h2>
      <label>Username</label>
      <input type="text" id="login-username" placeholder="Enter username">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="Enter password">
      <button onclick="login()">Login</button>
      <div class="result" id="login-result">Waiting...</div>
    </div>

    <!-- LOGOUT -->
    <div class="card">
      <h2>
        🚪 Logout
        <span class="status disconnected" id="auth-status">Disconnected</span>
      </h2>
      <p style="color:#7a5a99; font-size:0.85rem; margin-top:12px;">
        Logs out the current user by blacklisting the refresh token.
        You must be logged in first.
      </p>
      <button class="danger" onclick="logout()">Logout</button>
      <div class="result" id="logout-result">Waiting...</div>
    </div>

  </div>

  <!-- TOKEN DISPLAY -->
  <div class="token-display">
    <h2>🔑 Current JWT Tokens</h2>
    <label>Access Token (sent with every API request)</label>
    <div class="token-box" id="access-token">No token yet</div>
    <label style="margin-top:12px;">Refresh Token (used to get a new access token)</label>
    <div class="token-box" id="refresh-token">No token yet</div>
  </div>

  <script>
    const API = 'http://localhost:8000/api';

    // Store tokens in memory (never in localStorage for security)
    let accessToken  = null;
    let refreshToken = null;

    function setResult(id, message, isSuccess) {
      const el = document.getElementById(id);
      el.textContent = JSON.stringify(message, null, 2);
      el.className = 'result ' + (isSuccess ? 'success' : 'error');
    }

    function updateTokenDisplay() {
      document.getElementById('access-token').textContent  = accessToken  || 'No token yet';
      document.getElementById('refresh-token').textContent = refreshToken || 'No token yet';

      const status = document.getElementById('auth-status');
      if (accessToken) {
        status.textContent = 'Connected';
        status.className = 'status connected';
      } else {
        status.textContent = 'Disconnected';
        status.className = 'status disconnected';
      }
    }

    // --- REGISTER ---
    async function register() {
      const username = document.getElementById('reg-username').value;
      const email    = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;

      try {
        const response = await fetch(`${API}/register/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        const data = await response.json();
        setResult('reg-result', data, response.ok);
      } catch (err) {
        setResult('reg-result', { error: err.message }, false);
      }
    }

    // --- LOGIN ---
    async function login() {
      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;

      try {
        const response = await fetch(`${API}/login/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await response.json();

        if (response.ok) {
          // Store tokens in memory
          accessToken  = data.access;
          refreshToken = data.refresh;
          updateTokenDisplay();
          setResult('login-result', { message: 'Login successful !', user: data.user }, true);
        } else {
          setResult('login-result', data, false);
        }
      } catch (err) {
        setResult('login-result', { error: err.message }, false);
      }
    }

    // --- LOGOUT ---
    async function logout() {
      if (!refreshToken) {
        setResult('logout-result', { error: 'No token — please login first' }, false);
        return;
      }

      try {
        const response = await fetch(`${API}/logout/`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${accessToken}`
          },
          body: JSON.stringify({ refresh: refreshToken })
        });

        if (response.ok || response.status === 205) {
          accessToken  = null;
          refreshToken = null;
          updateTokenDisplay();
          setResult('logout-result', { message: 'Logged out successfully !' }, true);
        } else {
          const data = await response.json();
          setResult('logout-result', data, false);
        }
      } catch (err) {
        setResult('logout-result', { error: err.message }, false);
      }
    }
  </script>

</body>
</html>
